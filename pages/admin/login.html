<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - لوحة تحكم النكهة الشامية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/logo.png">
<style>
    .login-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .login-box {
        background: var(--surface-color);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 36px;
        width: 380px;
        max-width: 100%;
    }
    .login-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: bold;
        font-size: 1.2rem;
        margin-bottom: 8px;
        justify-content: center;
    }
    .login-logo i {
        background: var(--surface-light);
        padding: 8px;
        border-radius: 8px;
        color: var(--primary-color);
    }
    .login-subtitle {
        text-align: center;
        color: var(--text-muted);
        margin-bottom: 24px;
        font-size: 0.9rem;
    }
    .login-error {
        background: rgba(239, 83, 80, 0.15);
        border: 1px solid #ef5350;
        color: #ef9a9a;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 0.9rem;
        margin-bottom: 16px;
        display: none;
    }
    .login-error.show { display: block; }
    .btn-primary.full { width: 100%; justify-content: center; margin-top: 10px; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .code-input {
        text-align: center;
        letter-spacing: 10px;
        font-size: 1.4rem;
        font-weight: bold;
    }
    .back-link {
        display: block;
        text-align: center;
        margin-top: 16px;
        color: var(--text-muted);
        font-size: 0.85rem;
        cursor: pointer;
        text-decoration: underline;
    }
</style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-box">
        <div class="login-logo">
            <i class="ti ti-shopping-cart"></i>
            <span>النكهة الشامية</span>
        </div>
        <p class="login-subtitle" id="stepSubtitle">تسجيل الدخول إلى لوحة التحكم</p>

        <div class="login-error" id="loginError"></div>

        <form id="loginForm">
            <label>البريد الإلكتروني</label>
            <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="username" required>

            <label>كلمة المرور</label>
            <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>

            <button type="submit" class="btn-primary full" id="loginBtn">
                <i class="ti ti-login"></i>
                تسجيل الدخول
            </button>
        </form>

        <form id="twoFAForm" style="display:none;">
            <label>رمز التحقق (وصلك على بريدك الإلكتروني)</label>
            <input type="text" id="twoFACode" class="code-input" maxlength="6" inputmode="numeric" placeholder="000000" required>

            <button type="submit" class="btn-primary full" id="verifyBtn">
                <i class="ti ti-shield-check"></i>
                تأكيد الرمز
            </button>

            <span class="back-link" id="backToLogin">رجوع لتسجيل الدخول</span>
        </form>
    </div>
</div>

<!-- روابط السكربتات الخارجية -->
<script src="../../assets/config.js"></script>
<script src="../../assets/api-client.js"></script>
<script src="login-logic.js"></script>

</body>
</html>
